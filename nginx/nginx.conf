worker_processes auto; # one Nginx worker per CPU core

events {
    worker_connections 4096; # max open connections per Nginx worker
}

http {
    # host.docker.internal has an IPv4 AND an IPv6 address. Our app only listens on IPv4,
    # so every IPv6 try fails and Nginx has to retry. Ask Docker's DNS (127.0.0.11) for IPv4 only.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Access log: who called what, which server answered, and how long it took.
    log_format lab '$remote_addr "$request" $status '
                   'upstream=$upstream_addr total=${request_time}s app=${upstream_response_time}s';
    access_log /dev/stdout lab;

    # Part 4.2: an "upstream" = a named group of app servers.
    # "resolve" = look the name up with the resolver above (and refresh it every 30s).
    # zone = shared memory, so all Nginx workers share ONE round-robin counter
    # (without it, each worker counts on its own and they all start at server 1).
    upstream app_cluster {
        zone app_cluster 64k;
        server host.docker.internal:3000 resolve; # PM2 cluster (8 workers on one port)

        keepalive 64; # Part 4.3: keep up to 64 idle connections open per Nginx worker, reuse them
    }

    upstream app_pair {
        zone app_pair 64k;
        # Default method: round-robin (a, b, a, b...).
        # Try instead: least_conn;  -> pick the server with the fewest active requests
        #
        # max_fails / fail_timeout: 3 failed tries -> skip this server for 10s, then try it again.
        server host.docker.internal:3001 resolve max_fails=3 fail_timeout=10s; # "server A" (lab-a, 4 workers)
        server host.docker.internal:3002 resolve max_fails=3 fail_timeout=10s; # "server B" (lab-b, 4 workers)

        keepalive 64;
    }

    # Part 4.3: settings every proxied request gets (all servers below inherit them).
    proxy_http_version 1.1;         # keepalive to the app needs HTTP/1.1 (Nginx defaults to 1.0)
    proxy_set_header Connection ""; # don't forward "Connection: close", so the connection stays open

    proxy_set_header Host $host;                                  # the host the user asked for
    proxy_set_header X-Real-IP $remote_addr;                      # the user's IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # chain of IPs (user, proxies...)
    proxy_set_header X-Forwarded-Proto $scheme;                   # was it http or https?

    proxy_connect_timeout 2s;  # app not accepting the connection in 2s -> treat as down
    proxy_read_timeout 30s;    # app accepted but no answer in 30s -> give up
    proxy_next_upstream error timeout http_502 http_503; # on these, retry on the next server

    # Part 4.4: gzip. Nginx compresses the app's answer before sending it to the user.
    # Only if the user says it can read gzip (Accept-Encoding: gzip). Browsers always do.
    gzip on;
    gzip_comp_level 1;        # 1 = fastest, 9 = smallest. Level 1 already gets most of the gain.
    gzip_min_length 1024;     # tiny answers (< 1 KB) aren't worth the CPU
    gzip_types application/json text/plain text/css application/javascript; # text compresses well; images are already compressed
    gzip_vary on;             # tells caches: gzip and non-gzip versions are different
    gzip_proxied any;         # also compress answers that came from the app (proxied)

    # Part 4.1: reverse proxy. :8080 -> PM2 cluster
    server {
        listen 8080;

        location / {
            proxy_pass http://app_cluster;
        }
    }

    # Part 4.5: HTTPS. SSL termination = encryption ends HERE.
    # User <==HTTPS (encrypted)==> Nginx <--plain HTTP--> app
    # The app never deals with certificates or encryption.
    server {
        listen 8443 ssl;
        http2 on; # HTTP/2: many requests over one connection (browsers only do it over HTTPS)

        ssl_certificate     /etc/nginx/certs/localhost.crt; # public: sent to every visitor
        ssl_certificate_key /etc/nginx/certs/localhost.key; # private: never share
        ssl_protocols TLSv1.2 TLSv1.3;                      # old, broken versions (SSLv3, TLS 1.0/1.1) off

        # The TLS handshake is the expensive part. Remember finished handshakes for 10 minutes,
        # so a returning visitor skips most of it.
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://app_cluster; # X-Forwarded-Proto tells the app it was https
        }
    }

    # Part 4.2: load balancer. :8081 -> server A or server B
    server {
        listen 8081;

        location / {
            proxy_pass http://app_pair;
            add_header X-Upstream $upstream_addr always; # which server answered
        }
    }
}
